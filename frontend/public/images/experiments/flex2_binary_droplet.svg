<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="flex2Chamber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <radialGradient id="coolFlameHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(129, 140, 248, 0)" />
      <stop offset="60%" stop-color="rgba(129, 140, 248, 0.45)" />
      <stop offset="85%" stop-color="rgba(99, 102, 241, 0.65)" />
      <stop offset="100%" stop-color="rgba(67, 56, 202, 0)" />
    </radialGradient>
    <radialGradient id="hotFlameOuter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0)" />
      <stop offset="70%" stop-color="rgba(56, 189, 248, 0.25)" />
      <stop offset="90%" stop-color="rgba(245, 158, 11, 0.35)" />
      <stop offset="100%" stop-color="rgba(239, 68, 68, 0)" />
    </radialGradient>
    <radialGradient id="binaryDroplet" cx="42%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
    <filter id="glowF2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background CIR Chamber -->
  <rect width="800" height="800" fill="url(#flex2Chamber)" />
  <circle cx="400" cy="400" r="380" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,6" />

  <!-- Calibration Grid Lines -->
  <line x1="120" y1="400" x2="680" y2="400" stroke="#334155" stroke-width="0.8" stroke-dasharray="4,4" />
  <line x1="400" y1="120" x2="400" y2="680" stroke="#334155" stroke-width="0.8" stroke-dasharray="4,4" />

  <!-- Dual SiC Support Fibers (MDCA Mount) -->
  <line x1="50" y1="400" x2="750" y2="400" stroke="#475569" stroke-width="1.2" />
  <text x="60" y="390" fill="#64748b" font-family="monospace" font-size="11">14 μm SiC Cross Filament</text>

  <!-- Outermost Hot Flame Envelope (Fading after preferential heptane burn) -->
  <circle cx="400" cy="400" r="240" fill="url(#hotFlameOuter)" filter="url(#glowF2)" stroke="rgba(245,158,11,0.3)" stroke-dasharray="3,3" />

  <!-- Inner Concentric Cool-Flame Reaction Zone (Low-temperature OH*/CH* chemiluminescence) -->
  <circle cx="400" cy="400" r="150" fill="url(#coolFlameHalo)" filter="url(#glowF2)" />

  <!-- Binary Liquid Droplet Core (Heptane 80% / Hexadecane 20%) -->
  <circle cx="400" cy="400" r="32" fill="url(#binaryDroplet)" stroke="#38bdf8" stroke-width="1.8" />
  <circle cx="392" cy="390" r="6" fill="#f0f9ff" opacity="0.7" />

  <!-- Annotations / Callouts -->
  <!-- Droplet Core Callout -->
  <line x1="425" y1="420" x2="520" y2="480" stroke="#38bdf8" stroke-width="1.2" />
  <circle cx="425" cy="420" r="3" fill="#38bdf8" />
  <text x="530" y="480" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Binary Droplet Core (d = 2.20 mm)</text>
  <text x="530" y="495" fill="#94a3b8" font-family="sans-serif" font-size="10">80% n-Heptane / 20% n-Hexadecane</text>

  <!-- Cool Flame Callout -->
  <line x1="400" y1="250" x2="510" y2="200" stroke="#a78bfa" stroke-width="1.2" />
  <circle cx="400" cy="250" r="3" fill="#a78bfa" />
  <text x="520" y="200" fill="#a78bfa" font-family="sans-serif" font-size="11" font-weight="bold">Sustained Cool Flame Shell (600 - 850 K)</text>
  <text x="520" y="215" fill="#cbd5e1" font-family="sans-serif" font-size="10">Burning Rate K_cool = 0.28 mm²/s (Invisible in visible light)</text>

  <!-- Hot Flame Boundary Callout -->
  <line x1="400" y1="160" x2="250" y2="120" stroke="#f59e0b" stroke-width="1.2" />
  <circle cx="400" cy="160" r="3" fill="#f59e0b" />
  <text x="140" y="115" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">Hot Flame Extinction Diameter (d_e = 1.18 mm)</text>
  <text x="140" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="10">First-stage yellow/blue soot boundary extinguished</text>

  <!-- Scale Bar -->
  <line x1="100" y1="670" x2="200" y2="670" stroke="#94a3b8" stroke-width="2" />
  <line x1="100" y1="665" x2="100" y2="675" stroke="#94a3b8" stroke-width="2" />
  <line x1="200" y1="665" x2="200" y2="675" stroke="#94a3b8" stroke-width="2" />
  <text x="130" y="660" fill="#94a3b8" font-family="monospace" font-size="11">5.0 mm</text>

  <!-- NASA Space Apps Compliance Watermark -->
  <rect x="70" y="725" width="660" height="30" fill="rgba(15, 23, 42, 0.9)" rx="4" stroke="#334155" stroke-width="1" />
  <text x="80" y="745" fill="#94a3b8" font-family="sans-serif" font-size="10">
    SCIENTIFIC ILLUSTRATION (SYNTHETIC) — NOT A NASA PHOTOGRAPH · NASA PSI-70 (FLEX-2) · DOI: 10.60555/y812-q943
  </text>
</svg>
